server.port=${SERVER_PORT:50126}

# PostgreSQL 16 datasource
# Docker Compose uses the db service name by default; bare-metal deployments can override with env vars.
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/vmq}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:vmq}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA / Hibernate
# The project currently relies on JPA schema updates; production can switch to validate with managed DDL.
spring.jpa.hibernate.ddl-auto=${SPRING_JPA_HIBERNATE_DDL_AUTO:update}
spring.jpa.show-sql=${SPRING_JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true

# Flyway
spring.flyway.enabled=${SPRING_FLYWAY_ENABLED:false}
spring.flyway.baseline-on-migrate=${SPRING_FLYWAY_BASELINE_ON_MIGRATE:true}

spring.servlet.multipart.max-file-size=${SPRING_SERVLET_MULTIPART_MAX_FILE_SIZE:2MB}
spring.servlet.multipart.max-request-size=${SPRING_SERVLET_MULTIPART_MAX_REQUEST_SIZE:2MB}

# Android monitor offline detection. The app sends heartbeat every 30s; missing 2 beats means offline.
vmq.monitor.offline-timeout-ms=${VMQ_MONITOR_OFFLINE_TIMEOUT_MS:60000}
vmq.monitor.offline-check-rate-ms=${VMQ_MONITOR_OFFLINE_CHECK_RATE_MS:10000}
vmq.app-heart.time-window-ms=${VMQ_APP_HEART_TIME_WINDOW_MS:60000}
vmq.price-allocation.max-attempts=${VMQ_PRICE_ALLOCATION_MAX_ATTEMPTS:100}
server.servlet.session.timeout=${VMQ_SESSION_TIMEOUT:30m}
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.secure=${VMQ_SESSION_COOKIE_SECURE:true}
server.servlet.session.cookie.same-site=strict
